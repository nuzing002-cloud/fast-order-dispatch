name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dispatch:dispatch@127.0.0.1:5432/dispatch
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t fast-order-dispatch:ci .

      - name: Smoke test image
        run: |
          docker run -d --name fast-order-dispatch --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://dispatch:dispatch@127.0.0.1:5432/dispatch \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e CORS_ORIGIN=https://ci.example.com \
            -e API_KEYS=ci-smoke-token-0123456789:admin \
            -e RATE_LIMIT_MAX=120 \
            -e PAYMENT_PROVIDER=stripe \
            -e STRIPE_SECRET_KEY=sk_test_ci_smoke \
            -e STRIPE_WEBHOOK_SECRET=whsec_ci_smoke \
            fast-order-dispatch:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ready && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health
          curl -sf -H "x-api-key: ci-smoke-token-0123456789" http://127.0.0.1:3000/drivers
          docker logs fast-order-dispatch
          docker rm -f fast-order-dispatch
